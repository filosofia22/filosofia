<!DOCTYPE html>
<html lang="fi" prefix="og: https://ogp.me/ns#">

<head>
  <!-- Sivuston metatiedot -->
  <link rel="stylesheet" href="tyyli.css">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>

<main>

<button id="themeToggle" aria-pressed="false">Vaihda vaalea teema</button>

<moi>

</main>
<script>
  (function() {
    const btn = document.getElementById('themeToggle');
    const root = document.documentElement; // html
    const body = document.body;

    // Palautetaan tallennettu teema (light/dark)
    const saved = localStorage.getItem('site-theme');
    if (saved === 'light') {
      root.classList.add('light-theme');
      body.classList.add('light-theme');
      btn.textContent = 'Vaihda tumma teema';
      btn.setAttribute('aria-pressed', 'true');
    } else {
      // varmistus: poista jos jostain syystä lisätty
      root.classList.remove('light-theme');
      body.classList.remove('light-theme');
      btn.textContent = 'Vaihda vaalea teema';
      btn.setAttribute('aria-pressed', 'false');
    }

    btn.addEventListener('click', () => {
      const turningOn = !root.classList.contains('light-theme');
      // Lisätään/poistetaan molemmilta tasoilta varmistaen muuttujien periytyminen
      root.classList.toggle('light-theme', turningOn);
      body.classList.toggle('light-theme', turningOn);

      btn.textContent = turningOn ? 'Vaihda tumma teema' : 'Vaihda vaalea teema';
      btn.setAttribute('aria-pressed', turningOn ? 'true' : 'false');

      localStorage.setItem('site-theme', turningOn ? 'light' : 'dark');
    });
  })();
</script>

</body>

</html>
